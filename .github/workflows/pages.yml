name: Deploy portfolio to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".portfolio-parts/**"
      - "github-overrides/**"
      - "scripts/build-pages.mjs"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get portfolio files
        uses: actions/checkout@v4

      - name: Reassemble current portfolio
        run: |
          cat .portfolio-parts/part-* > zhang-haoran-portfolio-current.zip
          unzip -tq zhang-haoran-portfolio-current.zip

      - name: Unpack current portfolio
        run: |
          mkdir site
          unzip -q zhang-haoran-portfolio-current.zip -d site

      - name: Apply corrected MOMO artwork
        run: |
          cp -f github-overrides/public/portfolio/momo/09.webp site/public/portfolio/momo/09.webp
          cp -f github-overrides/public/portfolio/momo/13.webp site/public/portfolio/momo/13.webp

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install and build mobile-ready site
        working-directory: site
        run: |
          npm ci
          node ../scripts/build-pages.mjs

      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
